# OneLLMRouter 完整配置文件
# 复制为 onellm-router.yaml 并修改

server:
  host: "127.0.0.1"
  http_port: 3456
  # bell: false    # 关闭错误提示音，默认开启

log:
  level: "info"           # debug, info, warn, error
  dir: "~/.onellm/logs"    # 日志目录，按日期滚动
  max_age_days: 30         # 保留天数

proxy:
  socks5: "127.0.0.1:1082"

codex:
  # 始终生成 ~/.onellm/model-catalog.json；默认同时覆盖 ~/.codex/model-catalog.json
  overwrite_catalog: true
  # 按 provider/ 后的基础模型名匹配；配置优先于上游元数据
  models:
    gpt-5.5:
      default_reasoning_level: medium
      supported_reasoning_levels: [low, medium, high, xhigh]
    gpt-5.6-sol:
      default_reasoning_level: low
      supported_reasoning_levels: [low, medium, high, xhigh, max, ultra]
    gpt-5.6-terra:
      default_reasoning_level: medium
      supported_reasoning_levels: [low, medium, high, xhigh, max, ultra]
    gpt-5.6-luna:
      default_reasoning_level: medium
      supported_reasoning_levels: [low, medium, high, xhigh, max]

providers:
  - name: "GitHub Copilot"
    prefix: "cp"
    # cp 前缀内置处理，无需 base_url 和真实 api_key（OAuth 登录）
    api_key: "not-needed"
    models:
      - "claude-opus-4.8"
      - "claude-fable-5"

  - name: "DeepSeek"
    prefix: "ds"
    base_url: "https://api.deepseek.com/anthropic"
    openai_base_url: "https://api.deepseek.com"  # OpenAI 直通（零翻译），代码自动追加 /v1/chat/completions
    api_key: "sk-your-deepseek-key"
    proxy: false           # 国内直连，不走代理
    models:
      - "deepseek-v4-pro[1m]"
      - "deepseek-v4-flash[1m]"

  # OpenAI Responses API（Codex CLI）— 配置 responses_base_url 即可直通
  # - name: "OpenAI"
  #   prefix: "oai"
  #   responses_base_url: "https://api.openai.com"  # 代码自动追加 /v1/responses
  #   openai_base_url: "https://api.openai.com"      # 同时支持 chat/completions（可选）
  #   api_key: "sk-your-openai-key"
  #   proxy: true            # 走代理访问 OpenAI
  #   models:
  #     - "gpt-5"
  #     - "gpt-5-codex"

  # 78code 中转站（同时支持 Claude + Codex）
  # - name: "78code"
  #   prefix: "code78"
  #   base_url: "https://api.78code.cc/v1"           # Claude Code 用
  #   responses_base_url: "https://api.78code.cc"    # Codex CLI 用
  #   api_key: "sk-your-78code-key"
  #   proxy: true
  #   models:
  #     - "claude-fable-5"         # Anthropic + OpenAI 双端点
  #     - "claude-opus-4-8"        # Anthropic + OpenAI 双端点
  #     - "gpt-5.6-sol"            # 仅 OpenAI 端点（Codex CLI）

  # 添加更多 provider：
  # - name: "My API"
  #   prefix: "my"
  #   base_url: "https://my-api.example.com/anthropic"
  #   api_key: "sk-xxx"
  #   models: ["model-a", "model-b"]

# Claude Code 模型槽位 — 每个槽位指定 provider_prefix/model
# 启动时打印到控制台，复制到 Claude Code settings.json 即可
model_slots:
  default: "ds/deepseek-v4-pro[1m]"
  opus: "cp/claude-opus-4.8"
  sonnet: "ds/deepseek-v4-pro[1m]"
  haiku: "ds/deepseek-v4-flash[1m]"
  fable: "cp/claude-fable-5"
