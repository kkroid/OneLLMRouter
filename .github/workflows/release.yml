name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (major.minor.patch)"
        required: true
        default: "1.4.0"
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2022
    env:
      GOCACHE: ${{ github.workspace }}\.gocache

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tag must use v<major>.<minor>.<patch>"
            }
            $version = $Matches[1]
          }
          else {
            $version = $env:MANUAL_VERSION
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Manual version must use <major>.<minor>.<patch>"
            }
          }
          "RELEASE_VERSION=$version" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.4.3 --yes --no-progress

      - name: Verify Go
        shell: pwsh
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed: $LASTEXITCODE" }
          go test -race -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw "Go race tests failed: $LASTEXITCODE" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Go vet failed: $LASTEXITCODE" }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw "Go module verification failed: $LASTEXITCODE" }

      - name: Verify build and smoke safety
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\build-safety-test.ps1
          pwsh -NoProfile -File .\tools\desktop-smoke-safety-test.ps1
          pwsh -NoProfile -File .\tools\installer-autostart-contract-test.ps1

      - name: Build desktop and installer
        shell: pwsh
        run: |
          $qtRoot = [IO.Path]::GetFullPath((Join-Path $env:Qt6_DIR "..\..\.."))
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          pwsh -NoProfile -File .\build.ps1 -Version $env:RELEASE_VERSION -Installer -QtRoot $qtRoot -InnoSetup $iscc

      - name: Run isolated desktop smoke test
        shell: pwsh
        run: pwsh -NoProfile -File .\tools\desktop-smoke.ps1 -Tray .\desktop\stage\onellm-router-tray.exe -ProtectedPorts 3456,3457

      - name: Verify silent install preservation and autostart migration
        shell: pwsh
        run: |
          $setup = (Resolve-Path -LiteralPath ".\dist\OneLLMRouter-$env:RELEASE_VERSION-setup.exe").Path
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\OneLLMRouter"
          $configPath = Join-Path $env:USERPROFILE ".onellm\onellm-router.yaml"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $legacyMarker = "OneLLMRouter release workflow marker"
          $desktopRunValue = """$installDir\onellm-router-tray.exe"" --config ""$configPath"""
          New-Item -Path $runKey -Force | Out-Null
          New-ItemProperty -Path $runKey -Name "OneLLMRouter" -Value $legacyMarker -PropertyType String -Force | Out-Null

          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS="autostart"
          if ($LASTEXITCODE -ne 0) { throw "Silent install failed: $LASTEXITCODE" }
          if ($null -ne (Get-ItemPropertyValue -Path $runKey -Name "OneLLMRouter" -ErrorAction SilentlyContinue)) {
            throw "Installer left the legacy OneLLMRouter Run value behind"
          }
          if ((Get-ItemPropertyValue -Path $runKey -Name "OneLLMRouter Desktop") -ne $desktopRunValue) {
            throw "Silent install did not create the expected desktop autostart value"
          }

          $marker = "# OneLLMRouter config preservation marker $([guid]::NewGuid())"
          Set-Content -LiteralPath $configPath -Value $marker -Encoding utf8NoBOM
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS="autostart"
          if ($LASTEXITCODE -ne 0) { throw "Silent reinstall failed: $LASTEXITCODE" }
          if ((Get-Content -LiteralPath $configPath -Raw).Trim() -ne $marker) {
            throw "Silent reinstall overwrote the user configuration"
          }
          if ((Get-ItemPropertyValue -Path $runKey -Name "OneLLMRouter Desktop") -ne $desktopRunValue) {
            throw "Silent reinstall did not preserve the desktop autostart value"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Uninstaller not found: $uninstaller"
          }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Silent uninstall failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $configPath -PathType Leaf) -or
              (Get-Content -LiteralPath $configPath -Raw).Trim() -ne $marker) {
            throw "Uninstall removed or changed the user configuration"
          }
          if ($null -ne (Get-ItemPropertyValue -Path $runKey -Name "OneLLMRouter" -ErrorAction SilentlyContinue)) {
            throw "Uninstall restored the legacy OneLLMRouter Run value"
          }
          if ($null -ne (Get-ItemPropertyValue -Path $runKey -Name "OneLLMRouter Desktop" -ErrorAction SilentlyContinue)) {
            throw "Uninstall left the desktop autostart value behind"
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 `
              ".\dist\onellm-router-v$env:RELEASE_VERSION.exe", `
              ".\dist\OneLLMRouter-$env:RELEASE_VERSION-setup.exe" |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -LiteralPath ".\dist\SHA256SUMS.txt" -Encoding ascii

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneLLMRouter-${{ env.RELEASE_VERSION }}-windows-x64
          if-no-files-found: error
          path: |
            dist/onellm-router-v${{ env.RELEASE_VERSION }}.exe
            dist/OneLLMRouter-${{ env.RELEASE_VERSION }}-setup.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/onellm-router-v${{ env.RELEASE_VERSION }}.exe
            dist/OneLLMRouter-${{ env.RELEASE_VERSION }}-setup.exe
            dist/SHA256SUMS.txt
