name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (major.minor.patch)"
        required: true
        default: "1.4.0"
        type: string

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-2022
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
    env:
      GOCACHE: ${{ github.workspace }}\.gocache

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve release version
        id: release_version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tag must use v<major>.<minor>.<patch>"
            }
            $version = $Matches[1]
          }
          else {
            $version = $env:MANUAL_VERSION
            if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Manual version must use <major>.<minor>.<patch>"
            }
          }
          "RELEASE_VERSION=$version" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Set up Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.4.3 --yes --no-progress

      - name: Verify Go
        shell: pwsh
        run: |
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed: $LASTEXITCODE" }
          go test -race -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw "Go race tests failed: $LASTEXITCODE" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Go vet failed: $LASTEXITCODE" }
          go mod verify
          if ($LASTEXITCODE -ne 0) { throw "Go module verification failed: $LASTEXITCODE" }

      - name: Verify build and smoke safety
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\build-safety-test.ps1
          pwsh -NoProfile -File .\tools\desktop-smoke-safety-test.ps1
          pwsh -NoProfile -File .\tools\installer-autostart-contract-test.ps1
          pwsh -NoProfile -File .\tools\installer-upgrade-contract-test.ps1
          pwsh -NoProfile -File .\tools\release-workflow-contract-test.ps1

      - name: Build desktop and installer
        shell: pwsh
        run: |
          $qtRoot = [IO.Path]::GetFullPath((Join-Path $env:Qt6_DIR "..\..\.."))
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          pwsh -NoProfile -File .\build.ps1 -Version $env:RELEASE_VERSION -Installer -QtRoot $qtRoot -InnoSetup $iscc

      - name: Run isolated desktop smoke test
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\desktop-runtime-contract-test.ps1 -StageDirectory .\desktop\stage
          pwsh -NoProfile -File .\tools\desktop-smoke.ps1 -Tray .\desktop\stage\onellm-router-tray.exe -ProtectedPorts 3456,3457

      - name: Verify running installer upgrade
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\installer-running-upgrade-test.ps1 `
            -Setup .\dist\OneLLMRouter-$env:RELEASE_VERSION-setup.exe `
            -ProtectedPorts 3456,3457

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 `
              ".\dist\onellm-router-v$env:RELEASE_VERSION.exe", `
              ".\dist\OneLLMRouter-$env:RELEASE_VERSION-setup.exe" |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -LiteralPath ".\dist\SHA256SUMS.txt" -Encoding ascii

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OneLLMRouter-${{ env.RELEASE_VERSION }}-windows-x64
          if-no-files-found: error
          path: |
            dist/onellm-router-v${{ env.RELEASE_VERSION }}.exe
            dist/OneLLMRouter-${{ env.RELEASE_VERSION }}-setup.exe
            dist/SHA256SUMS.txt

  publish-release:
    if: github.ref_type == 'tag'
    needs: windows-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OneLLMRouter-${{ needs.windows-release.outputs.release_version }}-windows-x64
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/onellm-router-v${{ needs.windows-release.outputs.release_version }}.exe
            dist/OneLLMRouter-${{ needs.windows-release.outputs.release_version }}-setup.exe
            dist/SHA256SUMS.txt
